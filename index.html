<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monster Guide</title>
    <style>
        :root {
            --bg-color: #f1f5f9; --card-bg: #ffffff; --primary: #6366f1;
            --accent: #818cf8; --text: #1e293b; --success: #22c55e;
            --warning: #eab308; --danger: #ef4444; --gray: #94a3b8;
            --life-primary: #f472b6; 
        }

        body {
            font-family: -apple-system, sans-serif; background-color: var(--bg-color);
            color: var(--text); margin: 0; padding: 15px 15px 120px;
            display: flex; flex-direction: column; align-items: center;
        }

        /* 标签页切换 */
        .tab-nav { display: flex; background: #e2e8f0; padding: 4px; border-radius: 15px; width: 100%; max-width: 450px; margin-bottom: 15px; }
        .tab-btn { flex: 1; border: none; padding: 10px; border-radius: 12px; font-weight: bold; cursor: pointer; background: transparent; color: var(--gray); transition: 0.3s; }
        .tab-btn.active { background: white; color: var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* 顶部怪兽区域 */
        #monster-header { text-align: center; padding: 20px; background: var(--card-bg); border-radius: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 450px; margin-bottom: 15px; }
        #time-info { font-size: 16px; font-weight: bold; color: var(--primary); margin-bottom: 5px; }
        #monster-avatar { font-size: 60px; display: block; margin: 10px 0; animation: breathe 3s infinite; }
        @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        
        /* 心情曲线 */
        .mood-chart { display: flex; align-items: flex-end; justify-content: space-around; height: 40px; margin: 15px 0; padding: 0 40px; }
        .mood-bar { width: 8px; background: #e2e8f0; border-radius: 4px; transition: height 0.3s; position: relative; }
        .mood-bar.active { background: var(--primary); }

        /* 布局卡片 */
        .card { background: var(--card-bg); border-radius: 20px; padding: 18px; width: 100%; max-width: 450px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); box-sizing: border-box; }
        .energy-btn { border: none; background: #f1f5f9; padding: 6px 14px; border-radius: 15px; font-size: 12px; color: var(--gray); cursor: pointer; transition: 0.2s; }
        .energy-btn.active { background: var(--primary); color: white; }
        
        /* 灵动奶茶柜 */
        .tea-cabinet { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 40px; margin: 10px 0; padding: 10px; background: #fff5f7; border-radius: 15px; }
        .tea-icon { font-size: 26px; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .tea-icon.danger { animation: shake 0.5s infinite; filter: hue-rotate(300deg); }
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
        @keyframes shake { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(8deg); } 75% { transform: rotate(-8deg); } }

        /* 社交记录 */
        .memory-item { border-left: 4px solid var(--gray); padding-left: 12px; margin-bottom: 15px; font-size: 13px; background: #f8fafc; padding: 12px; border-radius: 0 15px 15px 0; }
        .memory-item.charge { border-color: var(--success); background: #f0fdf4; }
        .memory-item.drain { border-color: var(--danger); background: #fef2f2; }
        .tag { font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 5px; margin-right: 5px; }
        .tag-charge { background: var(--success); color: white; }
        .tag-drain { background: var(--danger); color: white; }

        /* 学业板块保持 */
        .heatmap-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; margin-top: 10px; }
        .heat-box { aspect-ratio: 1; border-radius: 4px; background: #f1f5f9; font-size: 8px; display: flex; align-items: center; justify-content: center; color: #cbd5e1; }
        .heat-box.today { border: 2px solid var(--primary); }
        .heat-level-3 { background: #4338ca; color: white; }
        .week-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; margin-top: 10px; }
        .week-box { aspect-ratio: 1; background: #f1f5f9; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 10px; cursor: pointer; }
        .week-box.status-green { background: var(--success); color: white; }
        .week-box.status-yellow { background: var(--warning); color: white; }
        .week-box.status-red { background: var(--danger); color: white; }

        /* 弹窗及通用 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-content { background: white; padding: 25px; border-radius: 28px; width: 85%; max-width: 400px; max-height: 85vh; overflow-y: auto; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; color: var(--gray); margin-bottom: 6px; }
        .form-group textarea, .form-group input, .form-group select { width: 100%; border: 1px solid #e2e8f0; padding: 12px; border-radius: 12px; box-sizing: border-box; background: #f8fafc; font-size: 14px; outline: none; }
        
        /* 特别美化：周复盘弹窗里的三个复盘框 */
        #review-modal textarea {
            width: 100%;
            border: 1px solid #e2e8f0;
            padding: 12px;
            border-radius: 12px;
            box-sizing: border-box;
            background: #f8fafc;
            font-size: 14px;
            outline: none;
            margin-bottom: 10px;
            display: block;
            font-family: inherit;
        }
        #review-modal textarea:focus {
            border-color: var(--primary);
            background: #ffffff;
        }

        .btn-submit { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 18px; font-weight: bold; cursor: pointer; }
        .btn-cancel { width: 100%; background: none; border: none; color: var(--gray); margin-top: 10px; cursor: pointer; font-size: 14px; }
        .bottom-nav { position: fixed; bottom: 20px; width: 90%; max-width: 450px; left: 50%; transform: translateX(-50%); }
    </style>
</head>
<body>

    <div class="tab-nav">
        <button class="tab-btn active" id="tab-study" onclick="switchTab('study')">📖 学业效率</button>
        <button class="tab-btn" id="tab-life" onclick="switchTab('life')">🍀 生活平衡</button>
    </div>

    <div id="monster-header">
        <div id="time-info">加载中...</div>
        <span id="monster-avatar">🧙‍♂️</span>
        <div id="monster-dialogue" style="font-size: 13px; margin: 10px 0;">新学期准备好了吗？</div>
        
        <!-- 心情曲线 -->
        <div class="mood-chart" id="mood-chart"></div>

        <div class="energy-bar" style="display:flex; gap:8px; justify-content:center;">
            <button class="energy-btn" id="e-btn-0" onclick="setEnergy(0)">💤 休息</button>
            <button class="energy-btn" id="e-btn-1" onclick="setEnergy(1)">🔋 正常</button>
            <button class="energy-btn" id="e-btn-2" onclick="setEnergy(2)">⚡️ 高能</button>
        </div>
    </div>

    <!-- 学业页 -->
    <div id="page-study" style="width: 100%; max-width: 450px;">
        <div class="card">
            <div style="font-size: 13px; font-weight: bold;">📅 未来 DDL 查询</div>
            <div class="heatmap-grid" id="heatmap-grid"></div>
        </div>
        <div id="course-list"></div>
        <div class="bottom-nav"><button class="btn-submit" onclick="addNewCourse()">+ 添加新课程</button></div>
    </div>

    <!-- 生活页 -->
    <div id="page-life" style="width: 100%; max-width: 450px; display: none;">
        <div class="card">
            <h3 style="margin-top:0">🧋 奶茶柜</h3>
            <div class="tea-cabinet" id="tea-cabinet"></div>
            <div style="display:flex; justify-content:center; gap:10px;">
                <button class="energy-btn" onclick="changeTea(-1)">- 丢弃</button>
                <button class="btn-submit" style="width:140px; background:var(--life-primary)" onclick="changeTea(1)">+ 喝一杯!</button>
            </div>
        </div>
        <div class="card">
            <h3 style="margin-top:0">🏊 健身站</h3>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div style="font-size:14px">本周已运动：<b id="val-sport" style="color:var(--primary); font-size:20px;">0</b> 次</div>
                <button class="energy-btn" style="background:var(--success); color:white; padding:8px 20px" onclick="openSportModal()">打卡</button>
            </div>
        </div>
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3>泡泡社交复盘</h3>
                <button class="energy-btn" onclick="openSocialModal()">+ 记录社交</button>
            </div>
            <div id="social-logs" style="margin-top:10px;"></div>
        </div>
    </div>

    <!-- 社交弹窗 -->
    <div id="social-modal" class="modal"><div class="modal-content">
        <h2 style="margin-top:0">✨ 社交记录</h2>
        <div class="form-group"><label>和谁在一起？</label><input type="text" id="s-who"></div>
        <div class="form-group">
            <label>社交性质</label>
            <select id="s-type" onchange="updateSocialUI()">
                <option value="charge">⚡️ 充能</option>
                <option value="drain">📉 消耗</option>
            </select>
        </div>
        <div class="form-group">
            <label id="s-label">✨ 记录这件小确幸</label>
            <textarea id="s-memo" rows="4" placeholder="那一刻发生了什么开心的事？"></textarea>
        </div>
        <button class="btn-submit" id="s-btn" onclick="saveSocial()">记录瞬间</button>
        <button class="btn-cancel" onclick="closeModals()">再想想</button>
    </div></div>

    <!-- 运动弹窗 -->
    <div id="sport-modal" class="modal"><div class="modal-content">
        <h2 style="margin-top:0">🏊 运动打卡</h2>
        <div class="form-group">
            <label>选择项目</label>
            <select id="sp-type">
                <option value="run">🏃 跑步</option>
                <option value="swim">🏊 游泳 </option>
                <option value="gym">🏋️ 羽毛球</option>
                <option value="other">💪 其他运动</option>
            </select>
        </div>
        <div class="form-group">
            <label>运动后的状态</label>
            <input type="text" id="sp-feel" placeholder="暴汗还是舒适？">
        </div>
        <button class="btn-submit" style="background:var(--success)" onclick="saveSport()">记录运动</button>
        <button class="btn-cancel" onclick="closeModals()">取消</button>
    </div></div>

    <!-- 其余弹窗 -->
    <div id="task-modal" class="modal"><div class="modal-content"><h2>🎒 新任务</h2><div class="form-group"><label>作业名称</label><input type="text" id="t-name"></div><div class="form-group"><label>截止时间</label><input type="date" id="t-ddl"></div><div class="form-group"><label>备注</label><textarea id="t-note" rows="3"></textarea></div><div class="form-group"><label>频率</label><select id="t-freq"><option value="once">不重复</option><option value="weekly">每周</option></select></div><button class="btn-submit" onclick="saveTask()">存入背包</button><button class="btn-cancel" onclick="closeModals()">取消</button></div></div>
    
    <!-- 复盘弹窗（CSS 已专门增强样式） -->
    <div id="review-modal" class="modal"><div class="modal-content">
        <h2>周复盘</h2>
        <div style="display:flex; gap:10px; justify-content:center; margin:10px 0;">
            <div style="width:35px; height:35px; background:var(--danger); border-radius:8px; cursor:pointer;" onclick="setRevColor('red')"></div>
            <div style="width:35px; height:35px; background:var(--warning); border-radius:8px; cursor:pointer;" onclick="setRevColor('yellow')"></div>
            <div style="width:35px; height:35px; background:var(--success); border-radius:8px; cursor:pointer;" onclick="setRevColor('green')"></div>
        </div>
        <textarea id="rev-learned" rows="3" placeholder="学到了什么？"></textarea>
        <textarea id="rev-hardest" rows="3" placeholder="最难的点？"></textarea>
        <textarea id="rev-apply" rows="3" placeholder="如何应用到实际？"></textarea>
        <button class="btn-submit" onclick="saveReview()">完成复盘</button>
        <button class="btn-cancel" onclick="closeModals()">取消</button>
    </div></div>

    <script>
        const SEMESTER_START = new Date('2026-03-02');
        let state = {
            energy: 1,
            courses: JSON.parse(localStorage.getItem('monster_v4_data')) || [],
            moodHistory: JSON.parse(localStorage.getItem('monster_mood_v2')) || [],
            life: JSON.parse(localStorage.getItem('monster_life_v3')) || { socialLogs: [], sportCount: 0, teaCount: 0 },
            curCId: null, curWIdx: null, tempColor: 'green'
        };

        function switchTab(tab) {
            document.getElementById('page-study').style.display = (tab === 'study' ? 'block' : 'none');
            document.getElementById('page-life').style.display = (tab === 'life' ? 'block' : 'none');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            render();
        }

        // 心情逻辑
        function setEnergy(level) {
            state.energy = level;
            const todayStr = new Date().toISOString().split('T')[0];
            const existing = state.moodHistory.find(m => m.date === todayStr);
            if (existing) existing.val = level + 1;
            else state.moodHistory.push({ date: todayStr, val: level + 1 });
            if (state.moodHistory.length > 7) state.moodHistory.shift();
            save(); render();
        }

        function drawMoodChart() {
            const chart = document.getElementById('mood-chart');
            chart.innerHTML = '';
            for (let i = 0; i < 7; i++) {
                const d = new Date(); d.setDate(d.getDate() - (6 - i));
                const dStr = d.toISOString().split('T')[0];
                const rec = state.moodHistory.find(m => m.date === dStr);
                const h = rec ? rec.val * 13 : 5;
                chart.innerHTML += `<div class="mood-bar ${rec ? 'active' : ''}" style="height: ${h}px"></div>`;
            }
            // 激活对应按钮样式
            document.querySelectorAll('.energy-btn').forEach((b, i) => b.classList.toggle('active', i === state.energy));
        }

        // 生活逻辑
        function updateSocialUI() {
            const type = document.getElementById('s-type').value;
            const label = document.getElementById('s-label');
            const btn = document.getElementById('s-btn');
            if (type === 'charge') {
                label.innerText = "✨ 记录确幸";
                label.style.color = "var(--success)";
                btn.style.background = "var(--life-primary)";
            } else {
                label.innerText = "💭 社交复盘";
                label.style.color = "var(--danger)";
                btn.style.background = "var(--gray)";
            }
        }

        function changeTea(n) { state.life.teaCount = Math.max(0, state.life.teaCount + n); save(); render(); }
        function saveSocial() {
            state.life.socialLogs.unshift({
                who: document.getElementById('s-who').value,
                type: document.getElementById('s-type').value,
                memo: document.getElementById('s-memo').value,
                date: new Date().toLocaleDateString()
            });
            if(state.life.socialLogs.length > 10) state.life.socialLogs.pop();
            closeModals(); save(); render();
        }
        function saveSport() { state.life.sportCount++; closeModals(); save(); render(); }

        function save() { 
            localStorage.setItem('monster_v4_data', JSON.stringify(state.courses)); 
            localStorage.setItem('monster_life_v3', JSON.stringify(state.life));
            localStorage.setItem('monster_mood_v2', JSON.stringify(state.moodHistory));
        }

        function render() {
            drawMoodChart();
            
            // 奶茶柜
            const cabinet = document.getElementById('tea-cabinet'); cabinet.innerHTML = '';
            for(let i=0; i<state.life.teaCount; i++) {
                const tea = document.createElement('span');
                tea.className = 'tea-icon' + (state.life.teaCount > 3 ? ' danger' : '');
                tea.innerText = '🧋'; cabinet.appendChild(tea);
            }

            // 社交日志
            document.getElementById('social-logs').innerHTML = state.life.socialLogs.map(l => `
                <div class="memory-item ${l.type}">
                    <span class="tag tag-${l.type}">${l.type === 'charge' ? '充能' : '复盘'}</span>
                    <b>${l.who}</b> <small>${l.date}</small>
                    <p style="margin:5px 0">${l.memo}</p>
                </div>
            `).join('') || '<div style="color:var(--gray);font-size:12px;text-align:center">还没有记录幸福瞬间...</div>';

            // 基础信息
            const now = new Date();
            const diffDays = Math.floor((now - SEMESTER_START) / (1000 * 60 * 60 * 24));
            document.getElementById('time-info').innerText = `第 ${Math.max(0, Math.floor(diffDays/7)+1)} 周 · ${["日", "一", "二", "三", "四", "五", "六"][now.getDay()]}`;
            document.getElementById('val-sport').innerText = state.life.sportCount;

            // 对话逻辑
            const dial = document.getElementById('monster-dialogue');
            if (state.life.teaCount > 3) dial.innerText = "奶茶警告！糖分超标啦，怪兽在瑟瑟发抖！";
            else if (state.life.sportCount > 2) dial.innerText = "运动达人！怪兽感觉到你在发光！";
            else dial.innerText = "新学期，让我们稳扎稳打。";

            drawHeatmap(); renderCourses();
        }

        // 核心学业逻辑
        function drawHeatmap() {
            const grid = document.getElementById('heatmap-grid'); grid.innerHTML = '';
            const taskMap = {};
            state.courses.forEach(c => c.tasks.forEach(t => { if(!t.done && t.ddl) taskMap[t.ddl] = (taskMap[t.ddl] || 0) + 1; }));
            for (let i = 0; i < 30; i++) {
                const d = new Date(); d.setDate(d.getDate() + i);
                const dStr = d.toISOString().split('T')[0];
                const count = taskMap[dStr] || 0;
                grid.innerHTML += `<div class="heat-box ${count>0?(count>=3?'heat-level-3':'heat-level-1'):''} ${i===0?'today':''}">${i===0?'今':d.getDate()}</div>`;
            }
        }

        function renderCourses() {
            const container = document.getElementById('course-list'); container.innerHTML = '';
            state.courses.forEach(course => {
                const card = document.createElement('div'); card.className = 'card';
                let weeks = course.weeks.map((w, i) => `<div class="week-box ${w.status?'status-'+w.status:''}" onclick="openReview(${course.id}, ${i})">${i+1}</div>`).join('');
                let tasks = course.tasks.filter(t => !t.done).map(t => `<div style="display:flex; justify-content:space-between; margin-top:10px; font-size:13px; background:#f8fafc; padding:8px; border-radius:10px;"><span><b>${t.name}</b> <small style="color:var(--danger)">${t.ddl}</small></span><button onclick="finishTask(${course.id}, ${t.id})" style="border:none; background:var(--primary); color:white; border-radius:5px; padding:2px 8px;">√</button></div>`).join('');
                card.innerHTML = `<div style="display:flex; justify-content:space-between"><h3>${course.name}</h3><button class="energy-btn" onclick="openTask(${course.id})">+ 任务</button></div><div class="week-grid">${weeks}</div>${tasks}`;
                container.appendChild(card);
            });
        }

        // 弹窗辅助
        function openSocialModal() { document.getElementById('social-modal').style.display='flex'; updateSocialUI(); }
        function openSportModal() { document.getElementById('sport-modal').style.display='flex'; }
        function openTask(id) { state.curCId = id; document.getElementById('task-modal').style.display='flex'; }
        function saveTask() { const c = state.courses.find(c => c.id === state.curCId); c.tasks.push({ id: Date.now(), name: document.getElementById('t-name').value, ddl: document.getElementById('t-ddl').value, note: document.getElementById('t-note').value, freq: document.getElementById('t-freq').value, done: false }); closeModals(); save(); render(); }
        function openReview(cId, wIdx) { state.curCId = cId; state.curWIdx = wIdx; const w = state.courses.find(c => c.id === cId).weeks[wIdx]; document.getElementById('rev-learned').value = w.learned||''; document.getElementById('rev-hardest').value = w.hardest||''; document.getElementById('rev-apply').value = w.apply||''; document.getElementById('review-modal').style.display='flex'; }
        function setRevColor(col) { state.tempColor = col; }
        function saveReview() { const w = state.courses.find(c => c.id === state.curCId).weeks[state.curWIdx]; w.status = state.tempColor; w.learned = document.getElementById('rev-learned').value; w.hardest = document.getElementById('rev-hardest').value; w.apply = document.getElementById('rev-apply').value; closeModals(); save(); render(); }
        function finishTask(cId, tId) { state.courses.find(c => c.id === cId).tasks.find(t => t.id === tId).done = true; save(); render(); }
        function closeModals() { document.querySelectorAll('.modal').forEach(m => m.style.display='none'); }
        function addNewCourse() { const name = prompt("课程名:"); if(name) { state.courses.push({ id: Date.now(), name, weeks: Array(16).fill(null).map(() => ({status:'', learned:'', hardest:'', apply:''})), tasks: [] }); save(); render(); } }

        render();
    </script>
</body>
</html>
